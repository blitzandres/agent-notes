name = "agent-notes"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Optional: attach to your domain once tested on *.workers.dev
# routes = [{ pattern = "example.com/*", zone_name = "example.com" }]

[[d1_databases]]
binding = "DB"
database_name = "agent-notes-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
SITE_ORIGIN = "https://example.com"
REDIRECT_ENABLED = "false"
TAG_LINKS_ENABLED = "true"
AGENT_NOTE_PER_HOUR = "5"
AGENT_NOTE_DAILY_CAP = "200"

# Optional secrets (set via `wrangler secret put`, never commit):
#   IP_SALT     — random string for HMAC-SHA256 rate-limit key hashing (raw IPs are never stored)
#   READ_TOKEN  — bearer token authorizing GET /api/agent-notes/summary
#   EDGE_TOKEN  — optional shared token if forwarding events to an external ANALYTICS_URL instead of local D1
